# Egern 配置（已去除订阅链接：各策略组的 urls 已清空，需填入自己的订阅链接后使用）
ipv6: true
allow_external_connections: true
vif_only: true
close_connections_on_policy_change: false
hide_vpn_icon: false
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://www.gstatic.com/generate_204
direct_latency_test_url: http://www.aliyun.com
compat_route: false
real_ip_domains:
- '*.srv.nintendo.net'
- '*.stun.playstation.net'
- xbox.*.microsoft.com
- '*.xboxlive.com'
- msftconnecttest.com
- msftncsi.com
- '*.msftconnecttest.com'
- '*.msftncsi.com'
- '*.battlenet.com.cn'
- '*.battlenet.com'
- '*.blzstatic.cn'
- '*.battle.net'
dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  - system
  upstreams:
    Aliyun:
    - 223.5.5.5
    - 223.6.6.6
    - https://dns.alidns.com/dns-query
    Tencent:
    - 119.29.29.29
    - 119.28.28.28
    - https://doh.pub/dns-query
    Cloudflare:
    - https://cloudflare-dns.com/dns-query
    - 1.0.0.1
    - 1.1.1.1
    Google:
    - https://dns.google/dns-query
    - 8.8.8.8
    - 8.8.4.4
  forward:
  - domain_wildcard:
      match: '*.cn'
      value: Aliyun
  - proxy_rule_set:
      match: https://github.com/ACL4SSR/ACL4SSR/raw/master/Clash/ChinaDomain.list
      value: Tencent
  - domain_regex:
      match: ^ad\..*|^ads\..*
      value: quic://dns.adguard-dns.com
  - domain_wildcard:
      match: '*.gstatic.com'
      value: Aliyun
  - domain_wildcard:
      match: '*'
      value: Google
  hosts:
    localhost:
    - 127.0.0.1
    0bc52bj2-10e0.aws-agent.org:
    - bad18bj2-1f25.apt-agent.org
    e3585sh0-3ad5.aws-agent.org:
    - 9a558sh8-8de9.apt-agent.org
    fd025gz8-c617.aws-agent.org:
    - b36d5gz0-2ac1.apt-agent.org
    0bc52bj8-10e0.aws-agent.org:
    - bad18bj2-1f25.apt-agent.org
    e3585sh2-3ad5.aws-agent.org:
    - 9a558sh8-8de9.apt-agent.org
    fd025gz0-c617.aws-agent.org:
    - b36d5gz0-2ac1.apt-agent.org
  proxy_nameservers:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - https://cloudflare-dns.com/dns-query
  - https://dns.google/dns-query
  - h3://dns.alidns.com/dns-query
  block_ips:
  - 1.2.3.4
  - 4.3.2.1/32
  public_ip_lookup_url: https://ifconfig.me/ip
